# Регионы сбора нефтяных новостей.
#
# [terms] - recall-термины заголовка по языкам Media Cloud: цель - ничего не
# потерять, точность обеспечивает классификатор. Термины региона - common,
# термины его языков и extra_terms. Термины с * пишутся строчными: шаблоны
# Lucene не проходят анализатор.
#
# [regions.<код>] - страна: коллекции Media Cloud (National и State & Local),
# основные языки потока и full_stream - качать ли поток целиком (он
# укладывается в квоту) или только кандидатов recall-запроса.

